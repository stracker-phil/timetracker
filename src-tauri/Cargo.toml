[package]
name = "timetracker"
version = "0.1.0"
description = "Local-first automatic time tracker for macOS"
authors = ["Philipp Stracker <info@philippstracker.com>"]
edition = "2024"
license = "MIT"

[lib]
name = "timetracker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
log = "0.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
ts-rs = { version = "12", features = ["serde-compat", "chrono-impl", "serde-json-impl", "no-serde-warnings"] }
libc = "0.2"
tempfile = { version = "3", optional = true }

[features]
# Exposes test helpers to integration tests in tests/.
test-util = ["dep:tempfile"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
# Itself with test helpers, so integration tests in tests/ can use them (ADR 0015).
timetracker = { path = ".", features = ["test-util"] }
tempfile = "3"
